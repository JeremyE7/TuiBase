# Copy this file to one of these locations:
#   Windows: %APPDATA%\ase-tui\connections.toml
#   Linux:   ~/.config/ase-tui/connections.toml
#   macOS:   ~/Library/Application Support/ase-tui/connections.toml
# Or keep it as ./connections.toml next to the executable.

# Disk catalog refresh interval. The default is 24 hours.
catalog_ttl_hours = 24

[[connections]]
name = "ASE desarrollo"
backend = "sybase_isql"
isql_path = "isql"
userstore_key = "ase_dev"
database = "master"
charset = "utf8"
allow_writes = false
extra_args = []

# Less secure fallback. Prefer userstore_key.
